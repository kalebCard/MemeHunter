[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-hunter"
version = "8.0.0"
description = "Institutional Multi-Agent Autonomous Quantitative Trading System"
authors = [
    { name = "Quantitative Architecture & Systems Engineering Core" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "polars>=0.20.0",
    "ccxt>=4.3.0",
    "filelock>=3.13.0",
    "cryptography>=42.0.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0"
]
cli = [
    "typer>=0.12.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.scripts]
meme-hunter = "meme_hunter.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "ASYNC", # flake8-async
    "PT",    # flake8-pytest-style
]
ignore = [
    "S101",  # Permitir asserts en pruebas y validaciones internas
    "S104",  # Permitir 0.0.0.0 en servidores si está configurado explícitamente
]

[tool.ruff.lint.isort]
known-first-party = ["meme_hunter"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "ccxt.*",
    "polars.*",
    "vectorbt.*",
    "riskfolio.*",
    "openbb.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
