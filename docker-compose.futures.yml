---
# meme_hunter - Despliegue de Futuros (USDT-M Bidireccional Long/Short)
services:
  freqtrade_futures:
    image: meme_hunter:2026.9
    restart: unless-stopped
    container_name: meme_hunter_futures
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "${MEME_DATA_DIR:-./data}:/freqtrade/user_data/data"
      - "./scripts:/freqtrade/scripts"
      - "./data_engine:/freqtrade/data_engine"
      - "./src/meme_hunter:/freqtrade/meme_hunter"
      - "./portfolio:/freqtrade/portfolio"
      - "./mining:/freqtrade/mining"
      - "./storage:/freqtrade/storage"
      - "./web/frequi/dist:/freqtrade/freqtrade/rpc/api_server/ui/installed"
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - PYTHONPATH=/freqtrade
    env_file:
      - path: .env
        required: false
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade_futures.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.futures.sqlite
      --config /freqtrade/user_data/config_futures.json
      --strategy MemeHunter_MinedEnsemble
