---
# meme_hunter - Despliegue de Futuros (USDT-M Bidireccional Long/Short)
services:
  freqtrade_futures:
    image: meme_hunter:2026.9
    restart: unless-stopped
    container_name: meme_hunter_futures
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "C:/meme_hunter_data:/freqtrade/user_data/data"
      - "./scripts:/freqtrade/scripts"
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - path: .env
        required: false
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade_futures.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.futures.sqlite
      --config /freqtrade/user_data/config_futures.json
      --strategy MemeHunter_MinedEnsemble
